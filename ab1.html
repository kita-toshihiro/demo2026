                            <!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cosmic Striker - 宇宙シューティング</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #050510;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 30px rgba(0, 150, 255, 0.3);
      border: 2px solid #1a3a60;
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #000;
    }
    .instructions {
      margin-top: 10px;
      font-size: 13px;
      color: #88a;
      text-align: center;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="480" height="640"></canvas>
</div>
<div class="instructions">
  操作: [矢印キー / WASD] 移動 ｜ [スペース] ショット ｜ [B / X] ボム ｜ マウス・タッチ操作にも対応
</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // --- Web Audio サウンド生成器 ---
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'laser') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'explosion') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'powerup') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(900, now + 0.2);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    } else if (type === 'bomb') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(80, now);
      osc.frequency.exponentialRampToValueAtTime(10, now + 0.8);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
      osc.start(now);
      osc.stop(now + 0.8);
    }
  }

  // --- ゲーム状態管理 ---
  let state = 'title'; // 'title', 'playing', 'gameover'
  let score = 0;
  let highScore = 0;
  let frame = 0;

  // 入力受付
  const keys = {};
  window.addEventListener('keydown', e => {
    initAudio();
    keys[e.code] = true;
    if (state === 'title' && (e.code === 'Space' || e.code === 'Enter')) {
      startGame();
    } else if (state === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) {
      startGame();
    } else if (state === 'playing' && (e.code === 'KeyB' || e.code === 'KeyX')) {
      triggerBomb();
    }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  // タッチ/マウス操作
  let pointerActive = false;
  let pointerX = canvas.width / 2;
  let pointerY = canvas.height - 100;

  function updatePointer(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    pointerX = (clientX - rect.left) * scaleX;
    pointerY = (clientY - rect.top) * scaleY;
  }

  canvas.addEventListener('mousedown', e => {
    initAudio();
    if (state !== 'playing') { startGame(); return; }
    pointerActive = true;
    updatePointer(e);
  });
  window.addEventListener('mousemove', e => { if (pointerActive) updatePointer(e); });
  window.addEventListener('mouseup', () => { pointerActive = false; });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    initAudio();
    if (state !== 'playing') { startGame(); return; }
    pointerActive = true;
    updatePointer(e);
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (pointerActive) updatePointer(e);
  }, { passive: false });
  canvas.addEventListener('touchend', () => { pointerActive = false; });

  // --- 星屑背景 ---
  const stars = [];
  for (let i = 0; i < 90; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 2.5 + 0.5,
      color: ['#fff', '#8cf', '#fd8'][Math.floor(Math.random() * 3)]
    });
  }

  // --- ゲームオブジェクト ---
  let player;
  let bullets = [];
  let enemyBullets = [];
  let enemies = [];
  let items = [];
  let particles = [];
  let boss = null;

  class Player {
    constructor() {
      this.w = 32;
      this.h = 36;
      this.x = canvas.width / 2 - this.w / 2;
      this.y = canvas.height - 80;
      this.speed = 5.5;
      this.hp = 100;
      this.maxHp = 100;
      this.bombs = 2;
      this.power = 1; // 1: 通常, 2: 2連, 3: 3WAY
      this.shootCooldown = 0;
      this.invulnerable = 0;
    }

    update() {
      if (pointerActive) {
        this.x += (pointerX - this.w / 2 - this.x) * 0.2;
        this.y += (pointerY - this.h / 2 - this.y) * 0.2;
      } else {
        if (keys['ArrowLeft'] || keys['KeyA']) this.x -= this.speed;
        if (keys['ArrowRight'] || keys['KeyD']) this.x += this.speed;
        if (keys['ArrowUp'] || keys['KeyW']) this.y -= this.speed;
        if (keys['ArrowDown'] || keys['KeyS']) this.y += this.speed;
      }

      // 画面端制限
      this.x = Math.max(0, Math.min(canvas.width - this.w, this.x));
      this.y = Math.max(0, Math.min(canvas.height - this.h, this.y));

      // 射撃 (スペースキーまたはポインター操作中)
      if (this.shootCooldown > 0) this.shootCooldown--;
      if ((keys['Space'] || pointerActive) && this.shootCooldown <= 0) {
        this.shoot();
        this.shootCooldown = 9;
      }

      if (this.invulnerable > 0) this.invulnerable--;
    }

    shoot() {
      playSound('laser');
      const cx = this.x + this.w / 2;
      if (this.power === 1) {
        bullets.push(new Bullet(cx - 3, this.y, 0, -10));
      } else if (this.power === 2) {
        bullets.push(new Bullet(cx - 8, this.y, 0, -10));
        bullets.push(new Bullet(cx + 4, this.y, 0, -10));
      } else {
        bullets.push(new Bullet(cx - 3, this.y, 0, -10));
        bullets.push(new Bullet(cx - 10, this.y, -2.5, -9.5));
        bullets.push(new Bullet(cx + 6, this.y, 2.5, -9.5));
      }
    }

    draw() {
      if (this.invulnerable % 6 >= 3) return; // 無敵点滅
      ctx.save();
      ctx.translate(this.x + this.w / 2, this.y + this.h / 2);

      // エンジン噴射の炎
      ctx.beginPath();
      ctx.moveTo(-6, this.h / 2 - 4);
      ctx.lineTo(0, this.h / 2 + 10 + Math.random() * 8);
      ctx.lineTo(6, this.h / 2 - 4);
      ctx.fillStyle = '#ff7700';
      ctx.fill();

      // 機体
      ctx.beginPath();
      ctx.moveTo(0, -this.h / 2);
      ctx.lineTo(this.w / 2, this.h / 2);
      ctx.lineTo(0, this.h / 2 - 6);
      ctx.lineTo(-this.w / 2, this.h / 2);
      ctx.closePath();
      ctx.fillStyle = '#00e5ff';
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 10;
      ctx.fill();

      // コックピット
      ctx.beginPath();
      ctx.arc(0, -2, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.restore();
    }
  }

  class Bullet {
    constructor(x, y, vx, vy) {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.w = 5;
      this.h = 12;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
    }
    draw() {
      ctx.fillStyle = '#39ff14';
      ctx.shadowColor = '#39ff14';
      ctx.shadowBlur = 8;
      ctx.fillRect(this.x, this.y, this.w, this.h);
      ctx.shadowBlur = 0;
    }
  }

  class EnemyBullet {
    constructor(x, y, vx, vy) {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.r = 4;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = '#ff2a6d';
      ctx.shadowColor = '#ff2a6d';
      ctx.shadowBlur = 6;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  class Enemy {
    constructor(type) {
      this.type = type; // 'scout', 'fighter'
      this.w = type === 'scout' ? 24 : 36;
      this.h = type === 'scout' ? 24 : 34;
      this.x = Math.random() * (canvas.width - this.w);
      this.y = -this.h;
      this.hp = type === 'scout' ? 1 : 4;
      this.speed = type === 'scout' ? 3.2 : 1.8;
      this.shootCooldown = Math.floor(Math.random() * 50) + 40;
      this.angle = 0;
    }

    update() {
      this.y += this.speed;
      if (this.type === 'scout') {
        this.x += Math.sin(this.y * 0.05) * 2;
      } else if (this.type === 'fighter') {
        this.shootCooldown--;
        if (this.shootCooldown <= 0) {
          const angle = Math.atan2((player.y - this.y), (player.x - this.x));
          enemyBullets.push(new EnemyBullet(this.x + this.w / 2, this.y + this.h, Math.cos(angle) * 3.5, Math.sin(angle) * 3.5));
          this.shootCooldown = 70;
        }
      }
    }

    draw() {
      ctx.save();
      ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
      ctx.beginPath();
      if (this.type === 'scout') {
        ctx.moveTo(0, this.h / 2);
        ctx.lineTo(this.w / 2, -this.h / 2);
        ctx.lineTo(-this.w / 2, -this.h / 2);
        ctx.fillStyle = '#ffaa00';
      } else {
        ctx.moveTo(0, this.h / 2);
        ctx.lineTo(this.w / 2, -this.h / 3);
        ctx.lineTo(0, -this.h / 2);
        ctx.lineTo(-this.w / 2, -this.h / 3);
        ctx.fillStyle = '#ff0055';
      }
      ctx.closePath();
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.restore();
    }
  }

  class Boss {
    constructor() {
      this.w = 90;
      this.h = 60;
      this.x = canvas.width / 2 - this.w / 2;
      this.y = -this.h;
      this.targetY = 70;
      this.hp = 80;
      this.maxHp = 80;
      this.speedX = 2;
      this.shootTimer = 0;
    }

    update() {
      if (this.y < this.targetY) {
        this.y += 1.5;
      } else {
        this.x += this.speedX;
        if (this.x <= 20 || this.x >= canvas.width - this.w - 20) {
          this.speedX *= -1;
        }

        this.shootTimer++;
        if (this.shootTimer % 45 === 0) {
          // 3連拡散弾
          const cx = this.x + this.w / 2;
          const cy = this.y + this.h;
          for (let a = -0.4; a <= 0.4; a += 0.4) {
            enemyBullets.push(new EnemyBullet(cx, cy, Math.sin(a) * 4, Math.cos(a) * 4));
          }
        }
      }
    }

    draw() {
      ctx.save();
      ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
      ctx.beginPath();
      ctx.moveTo(0, this.h / 2);
      ctx.lineTo(this.w / 2, 0);
      ctx.lineTo(this.w / 3, -this.h / 2);
      ctx.lineTo(-this.w / 3, -this.h / 2);
      ctx.lineTo(-this.w / 2, 0);
      ctx.closePath();
      ctx.fillStyle = '#9b51e0';
      ctx.shadowColor = '#d070ff';
      ctx.shadowBlur = 15;
      ctx.fill();

      // コア
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#ff0055';
      ctx.fill();
      ctx.restore();

      // ボスHPバー
      const barW = canvas.width - 60;
      ctx.fillStyle = '#333';
      ctx.fillRect(30, 20, barW, 8);
      ctx.fillStyle = '#ff2a6d';
      ctx.fillRect(30, 20, (this.hp / this.maxHp) * barW, 8);
    }
  }

  class Item {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.type = Math.random() < 0.5 ? 'power' : 'heal';
      this.size = 14;
    }
    update() { this.y += 1.6; }
    draw() {
      ctx.save();
      ctx.fillStyle = this.type === 'power' ? '#ffe600' : '#00ff88';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.type === 'power' ? 'P' : '+', this.x, this.y);
      ctx.restore();
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.vx = (Math.random() - 0.5) * 6;
      this.vy = (Math.random() - 0.5) * 6;
      this.color = color;
      this.life = 25;
      this.maxLife = 25;
      this.size = Math.random() * 3 + 2;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life--;
    }
    draw() {
      ctx.fillStyle = this.color;
      ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  function spawnExplosion(x, y, color = '#ff9900', count = 16) {
    playSound('explosion');
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(x, y, color));
    }
  }

  function triggerBomb() {
    if (player.bombs <= 0) return;
    player.bombs--;
    playSound('bomb');

    // 画面内敵弾消去
    enemyBullets = [];
    // 敵に大ダメージ
    enemies.forEach(e => {
      e.hp -= 10;
      spawnExplosion(e.x + e.w / 2, e.y + e.h / 2, '#fff', 10);
    });
    if (boss) {
      boss.hp -= 25;
      spawnExplosion(boss.x + boss.w / 2, boss.y + boss.h / 2, '#fff', 20);
    }

    // フラッシュ演出
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function checkCollision(r1, r2) {
    return (
      r1.x < r2.x + (r2.w || r2.size || r2.r * 2) &&
      r1.x + (r1.w || r1.size || r1.r * 2) > r2.x &&
      r1.y < r2.y + (r2.h || r2.size || r2.r * 2) &&
      r1.y + (r1.h || r1.size || r1.r * 2) > r2.y
    );
  }

  function startGame() {
    player = new Player();
    bullets = [];
    enemyBullets = [];
    enemies = [];
    items = [];
    particles = [];
    boss = null;
    score = 0;
    frame = 0;
    state = 'playing';
  }

  // --- メインループ ---
  function loop() {
    frame++;

    // 背景描画（星屑）
    ctx.fillStyle = '#060814';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.y += s.speed;
      if (s.y > canvas.height) s.y = 0;
      ctx.fillStyle = s.color;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    });

    if (state === 'title') {
      drawTitleScreen();
    } else if (state === 'playing') {
      updateGame();
      drawGame();
    } else if (state === 'gameover') {
      drawGameOverScreen();
    }

    requestAnimationFrame(loop);
  }

  function updateGame() {
    player.update();

    // 敵スポーン
    if (!boss && score >= 2000 && score % 2000 < 100) {
      boss = new Boss();
    } else if (!boss && frame % 45 === 0) {
      const type = Math.random() < 0.65 ? 'scout' : 'fighter';
      enemies.push(new Enemy(type));
    }

    // 自機弾更新
    bullets.forEach((b, bi) => {
      b.update();
      if (b.y < -20) bullets.splice(bi, 1);
    });

    // 敵弾更新
    enemyBullets.forEach((eb, ebi) => {
      eb.update();
      if (eb.y > canvas.height + 20 || eb.x < -20 || eb.x > canvas.width + 20) {
        enemyBullets.splice(ebi, 1);
        return;
      }
      // プレイヤーとの当たり判定
      if (player.invulnerable <= 0 && checkCollision(eb, player)) {
        player.hp -= 20;
        player.invulnerable = 40;
        spawnExplosion(player.x + player.w / 2, player.y + player.h / 2, '#ff4444', 10);
        enemyBullets.splice(ebi, 1);
        if (player.hp <= 0) {
          state = 'gameover';
          if (score > highScore) highScore = score;
        }
      }
    });

    // 敵更新 & 衝突判定
    enemies.forEach((e, ei) => {
      e.update();
      if (e.y > canvas.height + 50) {
        enemies.splice(ei, 1);
        return;
      }

      // 弾と敵
      bullets.forEach((b, bi) => {
        if (checkCollision(b, e)) {
          e.hp--;
          bullets.splice(bi, 1);
          if (e.hp <= 0) {
            spawnExplosion(e.x + e.w / 2, e.y + e.h / 2);
            score += e.type === 'scout' ? 100 : 250;
            if (Math.random() < 0.25) items.push(new Item(e.x + e.w / 2, e.y + e.h / 2));
            enemies.splice(ei, 1);
          }
        }
      });

      // プレイヤーと敵の直接衝突
      if (player.invulnerable <= 0 && checkCollision(e, player)) {
        player.hp -= 30;
        player.invulnerable = 40;
        e.hp = 0;
        spawnExplosion(e.x + e.w / 2, e.y + e.h / 2);
        enemies.splice(ei, 1);
        if (player.hp <= 0) {
          state = 'gameover';
          if (score > highScore) highScore = score;
        }
      }
    });

    // ボス更新
    if (boss) {
      boss.update();
      bullets.forEach((b, bi) => {
        if (checkCollision(b, boss)) {
          boss.hp--;
          bullets.splice(bi, 1);
          if (boss.hp <= 0) {
            spawnExplosion(boss.x + boss.w / 2, boss.y + boss.h / 2, '#ff00ff', 40);
            score += 1500;
            items.push(new Item(boss.x + boss.w / 2, boss.y + boss.h / 2));
            boss = null;
          }
        }
      });
    }

    // アイテム更新 & 取得
    items.forEach((item, ii) => {
      item.update();
      if (item.y > canvas.height + 20) {
        items.splice(ii, 1);
        return;
      }
      if (checkCollision(item, player)) {
        playSound('powerup');
        if (item.type === 'power') {
          player.power = Math.min(3, player.power + 1);
        } else {
          player.hp = Math.min(player.maxHp, player.hp + 30);
        }
        items.splice(ii, 1);
      }
    });

    // パーティクル更新
    particles.forEach((p, pi) => {
      p.update();
      if (p.life <= 0) particles.splice(pi, 1);
    });
  }

  function drawGame() {
    bullets.forEach(b => b.draw());
    enemyBullets.forEach(eb => eb.draw());
    enemies.forEach(e => e.draw());
    if (boss) boss.draw();
    items.forEach(i => i.draw());
    particles.forEach(p => p.draw());
    player.draw();

    // UIオーバーレイ
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 16, 28);
    ctx.textAlign = 'right';
    ctx.fillText(`BOMB: ${'💣'.repeat(player.bombs)}`, canvas.width - 16, 28);

    // HPバー
    ctx.textAlign = 'left';
    ctx.font = '12px sans-serif';
    ctx.fillText('SHIELD', 16, 50);
    ctx.fillStyle = '#222';
    ctx.fillRect(70, 40, 100, 12);
    ctx.fillStyle = player.hp > 30 ? '#00e5ff' : '#ff2a6d';
    ctx.fillRect(70, 40, Math.max(0, player.hp), 12);
  }

  function drawTitleScreen() {
    ctx.fillStyle = '#00e5ff';
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 15;
    ctx.fillText('COSMIC STRIKER', canvas.width / 2, canvas.height / 2 - 50);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#fff';
    ctx.font = '18px sans-serif';
    ctx.fillText('スペースキー または クリックで開始', canvas.width / 2, canvas.height / 2 + 30);

    ctx.fillStyle = '#88a';
    ctx.font = '14px sans-serif';
    ctx.fillText('アイテム: [P] 攻撃強化  [+] シールド回復', canvas.width / 2, canvas.height / 2 + 80);
  }

  function drawGameOverScreen() {
    ctx.fillStyle = '#ff2a6d';
    ctx.font = 'bold 40px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 60);

    ctx.fillStyle = '#fff';
    ctx.font = '20px sans-serif';
    ctx.fillText(`最終スコア: ${score}`, canvas.width / 2, canvas.height / 2 - 10);
    ctx.fillText(`ハイスコア: ${highScore}`, canvas.width / 2, canvas.height / 2 + 25);

    ctx.fillStyle = '#00e5ff';
    ctx.font = '16px sans-serif';
    ctx.fillText('スペースキー または クリックでリトライ', canvas.width / 2, canvas.height / 2 + 80);
  }

  // ループ開始
  loop();
})();
</script>
