                            <!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cosmic Striker - 宇宙シューティング</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #050510;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 35px rgba(0, 150, 255, 0.35);
      border: 2px solid #1a3a60;
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #000;
    }
    .instructions {
      margin-top: 8px;
      font-size: 13px;
      color: #88a;
      text-align: center;
    }

    /* サウンド切り替えコントロールパネル */
    #sound-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      max-width: 480px;
      margin-top: 10px;
      background: rgba(10, 15, 30, 0.85);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #1c2b45;
    }
    .sound-btn {
      background: #112233;
      border: 1px solid #00e5ff;
      color: #00e5ff;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      outline: none;
    }
    .sound-btn:hover {
      background: rgba(0, 229, 255, 0.2);
    }
    .sound-btn.muted {
      background: #1a1a24;
      border-color: #555566;
      color: #777788;
      text-decoration: line-through;
    }
    .sound-btn.all-mute {
      border-color: #ff0055;
      color: #ff0055;
    }
    .sound-btn.all-mute:hover {
      background: rgba(255, 0, 85, 0.2);
    }
    .sound-btn.all-mute.active {
      background: #ff0055;
      color: #fff;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="480" height="640"></canvas>
</div>

<!-- サウンド個別ミュートボタン群 -->
<div id="sound-controls">
  <button class="sound-btn" data-sound="bgm" tabindex="-1">🎵 BGM: ON</button>
  <button class="sound-btn" data-sound="laser" tabindex="-1">🔫 ショット: ON</button>
  <button class="sound-btn" data-sound="explosion" tabindex="-1">💥 爆発音: ON</button>
  <button class="sound-btn" data-sound="item" tabindex="-1">⭐ アイテム: ON</button>
  <button class="sound-btn" data-sound="bomb" tabindex="-1">💣 ボム: ON</button>
  <button class="sound-btn" data-sound="system" tabindex="-1">🔔 システム: ON</button>
  <button class="sound-btn all-mute" id="allMuteBtn" tabindex="-1">🔇 一括ミュート</button>
</div>

<div class="instructions">
  [矢印キー / WASD] 移動 ｜ [スペース] ショット ｜ [B / X] ボム ｜ タッチ操作対応
</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // --- ミュート状態管理 ---
  const soundSettings = {
    bgm: true,
    laser: true,
    explosion: true,
    item: true,
    bomb: true,
    system: true // warning, clear
  };

  // --- Web Audio サウンド & BGM ---
  let audioCtx = null;
  let bgmMasterGain = null;
  let bgmTimer = null;
  let bgmStep = 0;
  let isBossBgm = false;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      bgmMasterGain = audioCtx.createGain();
      bgmMasterGain.gain.setValueAtTime(soundSettings.bgm ? 1 : 0, audioCtx.currentTime);
      bgmMasterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    startBGM();
  }

  function midiToFreq(note) {
    return 440 * Math.pow(2, (note - 69) / 12);
  }

  // 効果音再生
  function playSound(type) {
    if (!audioCtx || audioCtx.state !== 'running') return;

    // カテゴリごとのミュートチェック
    if (type === 'laser' && !soundSettings.laser) return;
    if (type === 'explosion' && !soundSettings.explosion) return;
    if (type === 'powerup' && !soundSettings.item) return;
    if (type === 'bomb' && !soundSettings.bomb) return;
    if ((type === 'warning' || type === 'clear') && !soundSettings.system) return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'laser') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(850, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'explosion') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.exponentialRampToValueAtTime(25, now + 0.28);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
      osc.start(now);
      osc.stop(now + 0.28);
    } else if (type === 'powerup') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(950, now + 0.2);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    } else if (type === 'bomb') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(90, now);
      osc.frequency.exponentialRampToValueAtTime(10, now + 0.7);
      gain.gain.setValueAtTime(0.45, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.7);
      osc.start(now);
      osc.stop(now + 0.7);
    } else if (type === 'warning') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.setValueAtTime(250, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'clear') {
      const notes = [60, 64, 67, 72];
      notes.forEach((n, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(midiToFreq(n), now + i * 0.12);
        g.gain.setValueAtTime(0.22, now + i * 0.12);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.35);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start(now + i * 0.12);
        o.stop(now + i * 0.12 + 0.35);
      });
    }
  }

  // --- BGM シーケンサー ---
  const normalBass = [45, 45, 48, 45,  43, 43, 45, 43,  41, 41, 43, 41,  40, 40, 43, 45];
  const normalArp  = [57, 60, 64, 67,  55, 59, 62, 65,  53, 57, 60, 64,  52, 55, 59, 64];
  const bossBass   = [38, 38, 39, 38,  41, 38, 44, 43,  38, 38, 39, 38,  46, 45, 43, 41];
  const bossLead   = [62, 65, 68, 65,  62, 68, 70, 68,  62, 65, 68, 74,  73, 70, 68, 65];

  function playBgmTone(freq, type, duration, vol) {
    if (!audioCtx || audioCtx.state !== 'running' || !bgmMasterGain) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(bgmMasterGain);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function playHihat(vol) {
    if (!audioCtx || audioCtx.state !== 'running' || !bgmMasterGain) return;
    const bufferSize = audioCtx.sampleRate * 0.04;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    noise.connect(gain);
    gain.connect(bgmMasterGain);
    noise.start();
  }

  function startBGM() {
    if (bgmTimer) return;
    const stepInterval = isBossBgm ? 105 : 125;
    bgmTimer = setInterval(() => {
      if (state !== 'playing') return;

      const idx = bgmStep % 16;
      if (!isBossBgm) {
        playBgmTone(midiToFreq(normalBass[idx]), 'sawtooth', 0.12, 0.05);
        if (idx % 2 === 0) playBgmTone(midiToFreq(normalArp[idx]), 'sine', 0.16, 0.035);
        if (idx % 2 === 1) playHihat(0.02);
      } else {
        playBgmTone(midiToFreq(bossBass[idx]), 'sawtooth', 0.1, 0.08);
        playBgmTone(midiToFreq(bossLead[idx]), 'square', 0.09, 0.03);
        playHihat(idx % 4 === 0 ? 0.04 : 0.015);
      }
      bgmStep++;
    }, stepInterval);
  }

  function resetBgmTempo(toBoss) {
    if (isBossBgm === toBoss) return;
    isBossBgm = toBoss;
    if (bgmTimer) {
      clearInterval(bgmTimer);
      bgmTimer = null;
    }
    startBGM();
  }

  // --- UIボタンイベント処理 ---
  const soundButtons = document.querySelectorAll('.sound-btn[data-sound]');
  const allMuteBtn = document.getElementById('allMuteBtn');

  function updateBgmGain() {
    if (bgmMasterGain && audioCtx) {
      bgmMasterGain.gain.setValueAtTime(soundSettings.bgm ? 1 : 0, audioCtx.currentTime);
    }
  }

  soundButtons.forEach(btn => {
    btn.addEventListener('click', (e) => {
      initAudio();
      e.currentTarget.blur();
      const soundKey = btn.dataset.sound;
      soundSettings[soundKey] = !soundSettings[soundKey];

      const labelMap = {
        bgm: '🎵 BGM',
        laser: '🔫 ショット',
        explosion: '💥 爆発音',
        item: '⭐ アイテム',
        bomb: '💣 ボム',
        system: '🔔 システム'
      };

      if (soundSettings[soundKey]) {
        btn.classList.remove('muted');
        btn.textContent = `${labelMap[soundKey]}: ON`;
      } else {
        btn.classList.add('muted');
        btn.textContent = `${labelMap[soundKey]}: OFF`;
      }

      if (soundKey === 'bgm') {
        updateBgmGain();
      }
    });
  });

  allMuteBtn.addEventListener('click', (e) => {
    initAudio();
    e.currentTarget.blur();
    // 1つでもONがあれば全ミュート、全てOFFなら全解除
    const hasAnyOn = Object.values(soundSettings).some(v => v === true);
    const targetState = !hasAnyOn;

    for (let k in soundSettings) {
      soundSettings[k] = targetState;
    }
    updateBgmGain();

    soundButtons.forEach(btn => {
      const soundKey = btn.dataset.sound;
      const labelMap = {
        bgm: '🎵 BGM',
        laser: '🔫 ショット',
        explosion: '💥 爆発音',
        item: '⭐ アイテム',
        bomb: '💣 ボム',
        system: '🔔 システム'
      };
      if (targetState) {
        btn.classList.remove('muted');
        btn.textContent = `${labelMap[soundKey]}: ON`;
      } else {
        btn.classList.add('muted');
        btn.textContent = `${labelMap[soundKey]}: OFF`;
      }
    });

    if (!targetState) {
      allMuteBtn.classList.add('active');
      allMuteBtn.textContent = '🔊 全ミュート解除';
    } else {
      allMuteBtn.classList.remove('active');
      allMuteBtn.textContent = '🔇 一括ミュート';
    }
  });

  // --- ゲーム状態管理 ---
  let state = 'title';
  let currentStage = 1;
  let score = 0;
  let highScore = 0;
  let frame = 0;
  let clearTimer = 0;
  let stageBannerTimer = 0;
  let warningTimer = 0;

  const stageThemes = [
    { bg: '#040716', star: ['#ffffff', '#70d6ff', '#e9ff70'] },
    { bg: '#10041c', star: ['#ffffff', '#ff70a6', '#c77dff'] },
    { bg: '#1a0604', star: ['#ffffff', '#ff9f1c', '#ff4d6d'] },
    { bg: '#021814', star: ['#ffffff', '#2ec4b6', '#cbf3f0'] },
  ];

  function getTheme() {
    return stageThemes[(currentStage - 1) % stageThemes.length];
  }

  const keys = {};
  window.addEventListener('keydown', e => {
    initAudio();
    keys[e.code] = true;
    if ((state === 'title' || state === 'gameover') && (e.code === 'Space' || e.code === 'Enter')) {
      startGame();
    } else if (state === 'playing' && (e.code === 'KeyB' || e.code === 'KeyX')) {
      triggerBomb();
    }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  let pointerActive = false;
  let pointerX = canvas.width / 2;
  let pointerY = canvas.height - 100;

  function updatePointer(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    pointerX = (clientX - rect.left) * scaleX;
    pointerY = (clientY - rect.top) * scaleY;
  }

  canvas.addEventListener('mousedown', e => {
    initAudio();
    if (state === 'title' || state === 'gameover') { startGame(); return; }
    pointerActive = true;
    updatePointer(e);
  });
  window.addEventListener('mousemove', e => { if (pointerActive) updatePointer(e); });
  window.addEventListener('mouseup', () => { pointerActive = false; });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    initAudio();
    if (state === 'title' || state === 'gameover') { startGame(); return; }
    pointerActive = true;
    updatePointer(e);
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (pointerActive) updatePointer(e);
  }, { passive: false });
  canvas.addEventListener('touchend', () => { pointerActive = false; });

  // 星背景
  const stars = [];
  for (let i = 0; i < 90; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 2.5 + 0.6
    });
  }

  let player;
  let bullets = [];
  let enemyBullets = [];
  let enemies = [];
  let items = [];
  let particles = [];
  let boss = null;
  let enemiesKilledInStage = 0;
  const KILLS_FOR_BOSS = 10;

  class Player {
    constructor() {
      this.w = 32;
      this.h = 36;
      this.x = canvas.width / 2 - this.w / 2;
      this.y = canvas.height - 90;
      this.speed = 5.5;
      this.hp = 100;
      this.maxHp = 100;
      this.bombs = 2;
      this.power = 1;
      this.shootCooldown = 0;
      this.invulnerable = 0;
      this.warpSpeedY = 0;
    }

    update() {
      if (state === 'stage_clear') {
        this.warpSpeedY = Math.min(25, this.warpSpeedY + 0.6);
        this.y -= this.warpSpeedY;
        return;
      }

      if (pointerActive) {
        this.x += (pointerX - this.w / 2 - this.x) * 0.2;
        this.y += (pointerY - this.h / 2 - this.y) * 0.2;
      } else {
        if (keys['ArrowLeft'] || keys['KeyA']) this.x -= this.speed;
        if (keys['ArrowRight'] || keys['KeyD']) this.x += this.speed;
        if (keys['ArrowUp'] || keys['KeyW']) this.y -= this.speed;
        if (keys['ArrowDown'] || keys['KeyS']) this.y += this.speed;
      }

      this.x = Math.max(0, Math.min(canvas.width - this.w, this.x));
      this.y = Math.max(0, Math.min(canvas.height - this.h, this.y));

      if (this.shootCooldown > 0) this.shootCooldown--;
      if ((keys['Space'] || pointerActive) && this.shootCooldown <= 0) {
        this.shoot();
        this.shootCooldown = 9;
      }

      if (this.invulnerable > 0) this.invulnerable--;
    }

    shoot() {
      playSound('laser');
      const cx = this.x + this.w / 2;
      if (this.power === 1) {
        bullets.push(new Bullet(cx - 3, this.y, 0, -10));
      } else if (this.power === 2) {
        bullets.push(new Bullet(cx - 8, this.y, 0, -10));
        bullets.push(new Bullet(cx + 4, this.y, 0, -10));
      } else {
        bullets.push(new Bullet(cx - 3, this.y, 0, -10));
        bullets.push(new Bullet(cx - 10, this.y, -2.5, -9.5));
        bullets.push(new Bullet(cx + 6, this.y, 2.5, -9.5));
      }
    }

    draw() {
      if (this.invulnerable % 6 >= 3) return;
      ctx.save();
      ctx.translate(this.x + this.w / 2, this.y + this.h / 2);

      const flameLength = state === 'stage_clear' ? 35 + this.warpSpeedY * 2 : 10 + Math.random() * 8;
      ctx.beginPath();
      ctx.moveTo(-6, this.h / 2 - 4);
      ctx.lineTo(0, this.h / 2 + flameLength);
      ctx.lineTo(6, this.h / 2 - 4);
      ctx.fillStyle = state === 'stage_clear' ? '#00e5ff' : '#ff7700';
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(0, -this.h / 2);
      ctx.lineTo(this.w / 2, this.h / 2);
      ctx.lineTo(0, this.h / 2 - 6);
      ctx.lineTo(-this.w / 2, this.h / 2);
      ctx.closePath();
      ctx.fillStyle = '#00e5ff';
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 10;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, -2, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.restore();
    }
  }

  class Bullet {
    constructor(x, y, vx, vy) {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.w = 5;
      this.h = 12;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
    }
    draw() {
      ctx.fillStyle = '#39ff14';
      ctx.shadowColor = '#39ff14';
      ctx.shadowBlur = 8;
      ctx.fillRect(this.x, this.y, this.w, this.h);
      ctx.shadowBlur = 0;
    }
  }

  class EnemyBullet {
    constructor(x, y, vx, vy) {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.r = 4;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = '#ff2a6d';
      ctx.shadowColor = '#ff2a6d';
      ctx.shadowBlur = 6;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  class Enemy {
    constructor(type) {
      this.type = type;
      this.w = type === 'scout' ? 24 : 36;
      this.h = type === 'scout' ? 24 : 34;
      this.x = Math.random() * (canvas.width - this.w);
      this.y = -this.h;
      this.hp = (type === 'scout' ? 1 : 4) + Math.floor((currentStage - 1) * 0.7);
      this.speed = (type === 'scout' ? 3.2 : 1.8) + (currentStage - 1) * 0.2;
      this.shootCooldown = Math.max(30, Math.floor(Math.random() * 50) + 40 - currentStage * 3);
    }

    update() {
      this.y += this.speed;
      if (this.type === 'scout') {
        this.x += Math.sin(this.y * 0.05) * 2.2;
      } else if (this.type === 'fighter') {
        this.shootCooldown--;
        if (this.shootCooldown <= 0) {
          const bulletSpeed = 3.6 + (currentStage - 1) * 0.25;
          const angle = Math.atan2((player.y - this.y), (player.x - this.x));
          enemyBullets.push(new EnemyBullet(this.x + this.w / 2, this.y + this.h, Math.cos(angle) * bulletSpeed, Math.sin(angle) * bulletSpeed));
          this.shootCooldown = Math.max(35, 70 - currentStage * 4);
        }
      }
    }

    draw() {
      ctx.save();
      ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
      ctx.beginPath();
      if (this.type === 'scout') {
        ctx.moveTo(0, this.h / 2);
        ctx.lineTo(this.w / 2, -this.h / 2);
        ctx.lineTo(-this.w / 2, -this.h / 2);
        ctx.fillStyle = '#ffaa00';
      } else {
        ctx.moveTo(0, this.h / 2);
        ctx.lineTo(this.w / 2, -this.h / 3);
        ctx.lineTo(0, -this.h / 2);
        ctx.lineTo(-this.w / 2, -this.h / 3);
        ctx.fillStyle = '#ff0055';
      }
      ctx.closePath();
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.restore();
    }
  }

  class Boss {
    constructor() {
      this.w = 100;
      this.h = 65;
      this.x = canvas.width / 2 - this.w / 2;
      this.y = -this.h;
      this.targetY = 75;
      this.maxHp = 60 + currentStage * 25;
      this.hp = this.maxHp;
      this.speedX = 2 + (currentStage - 1) * 0.3;
      this.shootTimer = 0;
      resetBgmTempo(true);
    }

    update() {
      if (this.y < this.targetY) {
        this.y += 1.5;
      } else {
        this.x += this.speedX;
        if (this.x <= 20 || this.x >= canvas.width - this.w - 20) {
          this.speedX *= -1;
        }

        this.shootTimer++;
        const attackInterval = Math.max(25, 45 - currentStage * 3);
        if (this.shootTimer % attackInterval === 0) {
          const cx = this.x + this.w / 2;
          const cy = this.y + this.h;
          const spreadCount = currentStage >= 3 ? 5 : 3;
          const maxSpread = 0.4 + (currentStage - 1) * 0.08;
          const step = (maxSpread * 2) / (spreadCount - 1);
          for (let a = -maxSpread; a <= maxSpread + 0.01; a += step) {
            enemyBullets.push(new EnemyBullet(cx, cy, Math.sin(a) * 4, Math.cos(a) * 4));
          }
        }
      }
    }

    draw() {
      ctx.save();
      ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
      ctx.beginPath();
      ctx.moveTo(0, this.h / 2);
      ctx.lineTo(this.w / 2, 0);
      ctx.lineTo(this.w / 3, -this.h / 2);
      ctx.lineTo(-this.w / 3, -this.h / 2);
      ctx.lineTo(-this.w / 2, 0);
      ctx.closePath();
      ctx.fillStyle = currentStage % 2 === 0 ? '#ff0077' : '#9b51e0';
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 18;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fillStyle = '#00ffff';
      ctx.fill();
      ctx.restore();

      const barW = canvas.width - 60;
      ctx.fillStyle = '#222';
      ctx.fillRect(30, 22, barW, 10);
      ctx.fillStyle = '#ff2a6d';
      ctx.fillRect(30, 22, Math.max(0, (this.hp / this.maxHp) * barW), 10);
    }
  }

  class Item {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.type = Math.random() < 0.5 ? 'power' : 'heal';
      this.size = 14;
    }
    update() { this.y += 1.6; }
    draw() {
      ctx.save();
      ctx.fillStyle = this.type === 'power' ? '#ffe600' : '#00ff88';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.type === 'power' ? 'P' : '+', this.x, this.y);
      ctx.restore();
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.vx = (Math.random() - 0.5) * 6;
      this.vy = (Math.random() - 0.5) * 6;
      this.color = color;
      this.life = 25;
      this.maxLife = 25;
      this.size = Math.random() * 3 + 2;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life--;
    }
    draw() {
      ctx.fillStyle = this.color;
      ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
  }

  function spawnExplosion(x, y, color = '#ff9900', count = 16) {
    playSound('explosion');
    for (let i = 0; i < count; i++) {
      particles.push(new Particle(x, y, color));
    }
  }

  function triggerBomb() {
    if (player.bombs <= 0) return;
    player.bombs--;
    playSound('bomb');

    enemyBullets = [];
    enemies.forEach(e => {
      e.hp -= 10;
      spawnExplosion(e.x + e.w / 2, e.y + e.h / 2, '#fff', 10);
    });
    if (boss) {
      boss.hp -= 25;
      spawnExplosion(boss.x + boss.w / 2, boss.y + boss.h / 2, '#fff', 20);
    }

    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function checkCollision(r1, r2) {
    if (!r1 || !r2) return false;
    return (
      r1.x < r2.x + (r2.w || r2.size || r2.r * 2) &&
      r1.x + (r1.w || r1.size || r1.r * 2) > r2.x &&
      r1.y < r2.y + (r2.h || r2.size || r2.r * 2) &&
      r1.y + (r1.h || r1.size || r1.r * 2) > r2.y
    );
  }

  function startGame() {
    currentStage = 1;
    score = 0;
    frame = 0;
    player = new Player();
    bullets = [];
    enemyBullets = [];
    enemies = [];
    items = [];
    particles = [];
    boss = null;
    enemiesKilledInStage = 0;
    stageBannerTimer = 140;
    warningTimer = 0;
    resetBgmTempo(false);
    state = 'playing';
  }

  function startNextStage() {
    currentStage++;
    enemiesKilledInStage = 0;
    boss = null;
    enemyBullets = [];
    bullets = [];
    enemies = [];
    items = [];

    player.hp = player.maxHp;
    player.bombs = Math.min(3, player.bombs + 1);
    player.x = canvas.width / 2 - player.w / 2;
    player.y = canvas.height - 90;
    player.warpSpeedY = 0;
    player.invulnerable = 60;

    stageBannerTimer = 140;
    warningTimer = 0;
    resetBgmTempo(false);
    state = 'playing';
  }

  // --- メインループ ---
  function loop() {
    frame++;

    const theme = getTheme();
    ctx.fillStyle = theme.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const starSpeedMultiplier = state === 'stage_clear' ? 6 : 1;
    stars.forEach(s => {
      s.y += s.speed * starSpeedMultiplier;
      if (s.y > canvas.height) s.y = 0;
      ctx.fillStyle = theme.star[Math.floor((s.speed * 10) % theme.star.length)];
      ctx.fillRect(s.x, s.y, s.size, state === 'stage_clear' ? s.size * 3.5 : s.size);
    });

    if (state === 'title') {
      drawTitleScreen();
    } else if (state === 'playing') {
      updateGame();
      drawGame();
    } else if (state === 'stage_clear') {
      updateStageClear();
      drawGame();
      drawStageClearScreen();
    } else if (state === 'gameover') {
      drawGameOverScreen();
    }

    requestAnimationFrame(loop);
  }

  function updateGame() {
    player.update();

    if (!boss && enemiesKilledInStage >= KILLS_FOR_BOSS) {
      if (warningTimer === 0) {
        warningTimer = 80;
        playSound('warning');
      } else {
        warningTimer--;
        if (warningTimer <= 0) {
          boss = new Boss();
        }
      }
    } else if (!boss && frame % 45 === 0 && warningTimer === 0) {
      const type = Math.random() < 0.65 ? 'scout' : 'fighter';
      enemies.push(new Enemy(type));
    }

    for (let bi = bullets.length - 1; bi >= 0; bi--) {
      bullets[bi].update();
      if (bullets[bi].y < -20) {
        bullets.splice(bi, 1);
      }
    }

    for (let ebi = enemyBullets.length - 1; ebi >= 0; ebi--) {
      const eb = enemyBullets[ebi];
      eb.update();
      if (eb.y > canvas.height + 20 || eb.x < -20 || eb.x > canvas.width + 20) {
        enemyBullets.splice(ebi, 1);
        continue;
      }
      if (player.invulnerable <= 0 && checkCollision(eb, player)) {
        player.hp -= 20;
        player.invulnerable = 40;
        spawnExplosion(player.x + player.w / 2, player.y + player.h / 2, '#ff4444', 10);
        enemyBullets.splice(ebi, 1);
        if (player.hp <= 0) {
          state = 'gameover';
          resetBgmTempo(false);
          if (score > highScore) highScore = score;
        }
      }
    }

    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      e.update();
      if (e.y > canvas.height + 50) {
        enemies.splice(ei, 1);
        continue;
      }

      for (let bi = bullets.length - 1; bi >= 0; bi--) {
        if (checkCollision(bullets[bi], e)) {
          e.hp--;
          bullets.splice(bi, 1);
          if (e.hp <= 0) {
            spawnExplosion(e.x + e.w / 2, e.y + e.h / 2);
            score += e.type === 'scout' ? 100 : 250;
            enemiesKilledInStage++;
            if (Math.random() < 0.25) items.push(new Item(e.x + e.w / 2, e.y + e.h / 2));
            enemies.splice(ei, 1);
            break;
          }
        }
      }

      if (player.invulnerable <= 0 && checkCollision(e, player)) {
        player.hp -= 30;
        player.invulnerable = 40;
        spawnExplosion(e.x + e.w / 2, e.y + e.h / 2);
        enemies.splice(ei, 1);
        if (player.hp <= 0) {
          state = 'gameover';
          resetBgmTempo(false);
          if (score > highScore) highScore = score;
        }
      }
    }

    if (boss) {
      boss.update();
      for (let bi = bullets.length - 1; bi >= 0; bi--) {
        if (!boss) break;
        if (checkCollision(bullets[bi], boss)) {
          boss.hp--;
          bullets.splice(bi, 1);
          if (boss.hp <= 0) {
            spawnExplosion(boss.x + boss.w / 2, boss.y + boss.h / 2, '#ff00ff', 50);
            playSound('clear');
            score += 2000 * currentStage;
            boss = null;
            enemyBullets = [];
            enemies = [];

            score += player.hp * 10 + player.bombs * 500;
            state = 'stage_clear';
            clearTimer = 160;
            break;
          }
        }
      }
    }

    for (let ii = items.length - 1; ii >= 0; ii--) {
      const it = items[ii];
      it.update();
      if (it.y > canvas.height + 20) {
        items.splice(ii, 1);
        continue;
      }
      if (checkCollision(it, player)) {
        playSound('powerup');
        if (it.type === 'power') {
          player.power = Math.min(3, player.power + 1);
        } else {
          player.hp = Math.min(player.maxHp, player.hp + 30);
        }
        items.splice(ii, 1);
      }
    }

    for (let pi = particles.length - 1; pi >= 0; pi--) {
      particles[pi].update();
      if (particles[pi].life <= 0) particles.splice(pi, 1);
    }
  }

  function updateStageClear() {
    player.update();
    for (let pi = particles.length - 1; pi >= 0; pi--) {
      particles[pi].update();
      if (particles[pi].life <= 0) particles.splice(pi, 1);
    }

    clearTimer--;
    if (clearTimer <= 0) {
      startNextStage();
    }
  }

  function drawGame() {
    bullets.forEach(b => b.draw());
    enemyBullets.forEach(eb => eb.draw());
    enemies.forEach(e => e.draw());
    if (boss) boss.draw();
    items.forEach(i => i.draw());
    particles.forEach(p => p.draw());
    player.draw();

    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`STAGE ${currentStage}  |  SCORE: ${score}`, 16, 28);
    ctx.textAlign = 'right';
    ctx.fillText(`BOMB: ${'💣'.repeat(player.bombs)}`, canvas.width - 16, 28);

    ctx.textAlign = 'left';
    ctx.font = '12px sans-serif';
    ctx.fillText('SHIELD', 16, 50);
    ctx.fillStyle = '#222';
    ctx.fillRect(70, 40, 100, 12);
    ctx.fillStyle = player.hp > 30 ? '#00e5ff' : '#ff2a6d';
    ctx.fillRect(70, 40, Math.max(0, player.hp), 12);

    if (!boss && state === 'playing') {
      const remain = Math.max(0, KILLS_FOR_BOSS - enemiesKilledInStage);
      ctx.textAlign = 'right';
      ctx.fillStyle = remain === 0 ? '#ff3366' : '#aaa';
      ctx.font = '12px sans-serif';
      ctx.fillText(remain === 0 ? 'BOSS APPROACHING!!' : `BOSSまで: あと ${remain} 機`, canvas.width - 16, 50);
    }
    ctx.restore();

    if (warningTimer > 0 && !boss) {
      ctx.save();
      ctx.fillStyle = 'rgba(255, 0, 50, 0.25)';
      ctx.fillRect(0, canvas.height / 2 - 40, canvas.width, 80);
      ctx.fillStyle = '#ff1744';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#ff1744';
      ctx.shadowBlur = 15;
      ctx.fillText('⚠ WARNING: BOSS APPROACHING ⚠', canvas.width / 2, canvas.height / 2);
      ctx.restore();
    }

    if (stageBannerTimer > 0) {
      stageBannerTimer--;
      const alpha = Math.min(1, stageBannerTimer / 30);
      ctx.save();
      ctx.fillStyle = `rgba(0, 0, 0, ${0.7 * alpha})`;
      ctx.fillRect(0, canvas.height / 2 - 60, canvas.width, 120);

      ctx.fillStyle = '#00e5ff';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 20;
      ctx.fillText(`STAGE ${currentStage} START`, canvas.width / 2, canvas.height / 2);
      ctx.restore();
    }
  }

  function drawStageClearScreen() {
    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(0, canvas.height / 2 - 100, canvas.width, 200);

    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 38px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 18;
    ctx.fillText(`STAGE ${currentStage} CLEAR!`, canvas.width / 2, canvas.height / 2 - 45);

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText('WARP TO NEXT SECTOR...', canvas.width / 2, canvas.height / 2 + 5);

    ctx.fillStyle = '#ffe600';
    ctx.font = '14px sans-serif';
    ctx.fillText('+ シールド全快 & ボム補充 +', canvas.width / 2, canvas.height / 2 + 45);
    ctx.restore();
  }

  function drawTitleScreen() {
    ctx.save();
    ctx.fillStyle = '#00e5ff';
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 15;
    ctx.fillText('COSMIC STRIKER', canvas.width / 2, canvas.height / 2 - 50);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#fff';
    ctx.font = '18px sans-serif';
    ctx.fillText('スペースキー または クリックで開始', canvas.width / 2, canvas.height / 2 + 30);

    ctx.fillStyle = '#88a';
    ctx.font = '14px sans-serif';
    ctx.fillText('アイテム: [P] 攻撃強化  [+] シールド回復', canvas.width / 2, canvas.height / 2 + 80);
    ctx.restore();
  }

  function drawGameOverScreen() {
    ctx.save();
    ctx.fillStyle = '#ff2a6d';
    ctx.font = 'bold 40px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 60);

    ctx.fillStyle = '#fff';
    ctx.font = '20px sans-serif';
    ctx.fillText(`到達ステージ: STAGE ${currentStage}`, canvas.width / 2, canvas.height / 2 - 15);
    ctx.fillText(`最終スコア: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
    ctx.fillText(`ハイスコア: ${highScore}`, canvas.width / 2, canvas.height / 2 + 45);

    ctx.fillStyle = '#00e5ff';
    ctx.font = '16px sans-serif';
    ctx.fillText('スペースキー または クリックでリトライ', canvas.width / 2, canvas.height / 2 + 95);
    ctx.restore();
  }

  loop();
})();
</script>
